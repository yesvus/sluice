    provider: openrouter
    onwatch_key: ""
    kind: free_tier
    tier: free
    deployments: [fixture-free-model]
    threshold: 0.9
  - id: fixture-api-cheap
    provider: synthetic
    onwatch_key: ""
    kind: api_key
    tier: cheap
    deployments: [fixture-cheap-model]
    threshold: 0.8
  - id: fixture-codex-display
    provider: codex
    onwatch_key: "101"
    kind: subscription_observed
    tier: frontier
    deployments: []
